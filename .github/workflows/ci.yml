name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Run tests
        run: python -m pytest app/tests

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit -r app/requirements.txt

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --no-cache -t azure-github-actions-devsecops:${{ github.sha }} .

      - name: Verify container dependencies
        run: |
          echo "=== Installed setuptools ==="
          docker run --rm azure-github-actions-devsecops:${{ github.sha }} python -m pip show setuptools

          echo "=== Checking for msgpack ==="
          docker run --rm azure-github-actions-devsecops:${{ github.sha }} python -m pip show msgpack || true

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: azure-github-actions-devsecops:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-files: /usr/local/lib/python3.13/site-packages/pip/_vendor/bom.cdx.json